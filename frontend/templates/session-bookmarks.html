<!-- Session Bookmarks Page -->
<div class="sb-page">
    <!-- Stats -->
    <div class="grid grid-4" id="sb-stats">
        <div class="card stat-card">
            <div class="stat-value" id="sb-stat-pending">-</div>
            <div class="stat-label">Pending</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" id="sb-stat-resumed" style="color: var(--success, #a6e3a1)">-</div>
            <div class="stat-label">Resumed</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" id="sb-stat-archived" style="color: #6c7086">-</div>
            <div class="stat-label">Archived</div>
        </div>
        <div class="card stat-card">
            <div class="stat-value" id="sb-stat-total">-</div>
            <div class="stat-label">Total</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card" style="margin-bottom: 16px;">
        <div class="card-body" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <select id="sb-filter-status" class="form-select" style="width: auto;">
                <option value="">Tous</option>
                <option value="pending" selected>Pending</option>
                <option value="resumed">Resumed</option>
                <option value="archived">Archived</option>
            </select>
            <input type="text" id="sb-filter-project" class="form-control" placeholder="PRJ-XXX..." style="width: 140px;">
            <button class="btn btn-primary" onclick="window.SessionBookmarksModule.showCreateModal()">+ Nouveau bookmark</button>
        </div>
    </div>

    <!-- Bookmarks List -->
    <div id="sb-bookmarks-container">
        <p style="text-align: center; padding: 40px; color: #888;">Chargement...</p>
    </div>
</div>

<!-- Create/Edit Modal -->
<div id="sb-modal" class="sb-modal-overlay" style="display: none;" onclick="if(event.target===this) window.SessionBookmarksModule.closeModal()">
    <div class="sb-modal">
        <div class="sb-modal-header">
            <h3 id="sb-modal-title">Nouveau Session Bookmark</h3>
            <button class="btn btn-icon" onclick="window.SessionBookmarksModule.closeModal()">&times;</button>
        </div>
        <div class="sb-modal-body">
            <input type="hidden" id="sb-edit-id">
            <div class="form-group">
                <label>Sujet *</label>
                <input type="text" id="sb-input-subject" class="form-control" placeholder="Ex: Refactoring API routes...">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label>Date *</label>
                    <input type="date" id="sb-input-date" class="form-control">
                </div>
                <div class="form-group">
                    <label>Projet</label>
                    <input type="text" id="sb-input-project" class="form-control" placeholder="PRJ-XXX">
                </div>
            </div>
            <div class="form-group">
                <label>Session ID</label>
                <input type="text" id="sb-input-session-id" class="form-control" placeholder="UUID de la session Claude">
            </div>
            <div class="form-group">
                <label>Fichiers a relire (un par ligne)</label>
                <textarea id="sb-input-files" class="form-control" rows="3" placeholder="/data/projects/mon-projet/backend/app.py&#10;/data/projects/mon-projet/.claude/PROJECT_STATUS.md"></textarea>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="sb-input-notes" class="form-control" rows="3" placeholder="Contexte, etat du travail, prochaines etapes..."></textarea>
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="sb-input-status" class="form-select">
                    <option value="pending">Pending</option>
                    <option value="resumed">Resumed</option>
                    <option value="archived">Archived</option>
                </select>
            </div>
        </div>
        <div class="sb-modal-footer">
            <button class="btn" onclick="window.SessionBookmarksModule.closeModal()">Annuler</button>
            <button class="btn btn-primary" onclick="window.SessionBookmarksModule.submitBookmark()">Creer</button>
        </div>
    </div>
</div>
