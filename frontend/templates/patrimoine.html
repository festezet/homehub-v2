<!-- Patrimoine Tab -->
<div class="patrimoine-container">
    <!-- Summary cards -->
    <div class="pat-summary">
        <div class="pat-summary-card">
            <div class="pat-summary-label">Total patrimoine</div>
            <div class="pat-summary-value" id="pat-total">--</div>
            <div class="pat-summary-sub" id="pat-snapshot-date"></div>
        </div>
        <div class="pat-summary-card" id="pat-cats-summary"></div>
    </div>

    <!-- Toolbar -->
    <div class="pat-toolbar">
        <button class="btn btn-sm btn-primary" onclick="window.PatrimoineModule.showAddSnapshot()">+ Snapshot</button>
        <button class="btn btn-sm" onclick="window.PatrimoineModule.showAddAccount()">+ Compte</button>
        <button class="btn btn-sm" onclick="window.PatrimoineModule.toggleEditMode()">
            <span id="pat-edit-toggle">Modifier</span>
        </button>
    </div>

    <!-- Main table -->
    <div class="pat-table-wrap">
        <table class="pat-table" id="pat-table">
            <thead id="pat-thead"></thead>
            <tbody id="pat-tbody"></tbody>
            <tfoot id="pat-tfoot"></tfoot>
        </table>
    </div>

    <!-- Save bar (visible in edit mode) -->
    <div class="pat-save-bar" id="pat-save-bar" style="display:none;">
        <span id="pat-changes-count">0 modification(s)</span>
        <button class="btn btn-sm btn-primary" onclick="window.PatrimoineModule.saveChanges()">Sauvegarder</button>
        <button class="btn btn-sm" onclick="window.PatrimoineModule.cancelChanges()">Annuler</button>
    </div>
</div>

<!-- Add Snapshot Modal -->
<div class="pat-modal" id="pat-snap-modal" style="display:none;">
    <div class="pat-modal-content">
        <h3>Nouveau snapshot</h3>
        <label>Date</label>
        <input type="date" id="pat-snap-date">
        <label>Label (optionnel)</label>
        <input type="text" id="pat-snap-label" placeholder="ex: Juillet 2025">
        <div class="pat-modal-actions">
            <button class="btn btn-sm btn-primary" onclick="window.PatrimoineModule.submitSnapshot()">Creer</button>
            <button class="btn btn-sm" onclick="window.PatrimoineModule.closeModals()">Annuler</button>
        </div>
    </div>
</div>

<!-- Add Account Modal -->
<div class="pat-modal" id="pat-acct-modal" style="display:none;">
    <div class="pat-modal-content">
        <h3>Nouveau compte</h3>
        <label>Nom</label>
        <input type="text" id="pat-acct-name" placeholder="ex: Livret A">
        <label>Categorie</label>
        <select id="pat-acct-category"></select>
        <label>Type (optionnel)</label>
        <input type="text" id="pat-acct-type" placeholder="ex: livret, assurance-vie">
        <label>Notes (optionnel)</label>
        <input type="text" id="pat-acct-notes">
        <div class="pat-modal-actions">
            <button class="btn btn-sm btn-primary" onclick="window.PatrimoineModule.submitAccount()">Creer</button>
            <button class="btn btn-sm" onclick="window.PatrimoineModule.closeModals()">Annuler</button>
        </div>
    </div>
</div>
