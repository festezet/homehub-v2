<!-- Delete handler — inline script (not ES module) to bypass browser module cache -->
<script>
(function() {
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.td-card-delete-btn');
        if (!btn) return;
        e.preventDefault();
        e.stopPropagation();
        // Get thread id from the card container
        var card = btn.closest('.td-card');
        var threadId = card && card.dataset.threadId;
        if (!threadId) {
            // Fallback: try data-id on the button itself
            threadId = btn.dataset.id;
        }
        if (!threadId) return;
        if (!confirm('Supprimer ce fil et ses digests ?')) return;
        fetch('http://localhost:5000/api/threads/' + threadId, { method: 'DELETE' })
            .then(function(r) { return r.json(); })
            .then(function() {
                // Remove card from DOM
                if (card) card.remove();
                // Check if no cards left
                var container = document.getElementById('td-cards');
                if (container && container.querySelectorAll('.td-card').length === 0) {
                    var empty = document.getElementById('td-empty');
                    if (empty) empty.style.display = 'block';
                }
            })
            .catch(function(err) { console.error('Delete thread error:', err); });
    });
})();
</script>
